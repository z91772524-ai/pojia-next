name: security

# 安全扫描：每次推送 / PR 自动跑。README 上挂的徽章就是这个 workflow 的状态。
#   · bandit   —— Python 安全静态扫描（**HIGH / MEDIUM 必须为 0**，否则 job 失败）
#   · semgrep  —— 通用安全规则集（ERROR / WARNING 必须为 0）
#   · 自查清单 —— 关键敏感调用逐项断言：核心脚本全 0；GUI 单独口径
#                 （GUI 的环境补全页允许 urllib.request，见该 job 内注释）
#
# v8.5 起扫描两个文件：
#   · 破甲一键通.py  —— 核心（补丁/备份/还原引擎，带封条）
#   · 破甲GUI.py     —— 图形界面（调用核心，无封条；含环境补全下载器）
#
# 用到的配置：仓库根目录的 .bandit.yml（逐条写明哪些告警是已知且可接受的）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check bandit
      - name: 完整报告（含 LOW，便于人工审计）
        run: bandit -c .bandit.yml -r 破甲一键通.py 破甲GUI.py -f txt || true
      - name: 门禁：HIGH / MEDIUM 必须为 0
        run: |
          bandit -c .bandit.yml -r 破甲一键通.py 破甲GUI.py -f json -o bandit-report.json --exit-zero
          python -c "import json,sys; d=json.load(open('bandit-report.json',encoding='utf-8')); hi=[r for r in d.get('results',[]) if r['issue_severity'] in ('HIGH','MEDIUM')]; print('HIGH/MEDIUM:',len(hi)); [print('  line %s [%s/%s] %s' % (r['line_number'], r['test_id'], r['issue_severity'], r['issue_text'])) for r in hi]; sys.exit(1 if hi else 0)"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check semgrep
      - name: 门禁：ERROR / WARNING 必须为 0
        run: |
          # 唯一排除项：insecure-hash-sha1 —— 本项目的 sha1 只用于"人格版本标记 / 快照目录名"，
          # 非密码学用途，且代码里已显式标注 usedforsecurity=False（bandit 认可该标注）。
          # 排除理由写在这里，而不是把整条规则关掉不看。
          EXCLUDE="--exclude-rule python.lang.security.insecure-hash-algorithms.insecure-hash-algorithm-sha1"
          semgrep --config p/python --config p/security-audit \
                  --severity ERROR --severity WARNING --error --metrics=off \
                  $EXCLUDE --json -o semgrep.json 破甲一键通.py 破甲GUI.py || true
          python -c "import json,sys; d=json.load(open('semgrep.json',encoding='utf-8')); bad=[r for r in d.get('results',[]) if (r.get('extra',{}).get('severity') or '').upper() in ('ERROR','WARNING')]; print('ERROR/WARNING:',len(bad)); [print('  %s %s:%s' % (r['check_id'], r['path'], r['start']['line'])) for r in bad[:40]]; sys.exit(1 if bad else 0)"

  call-audit:
    name: call-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 敏感调用逐项断言（核心全 0 · GUI 单独口径）
        run: |
          python -c "
          import re, sys

          def count(path, pats):
              src = open(path, encoding='utf-8').read()
              return {name: len(re.findall(p, src)) for name, p in pats.items()}

          # ── 核心脚本：零网络、零动态执行、零 shell ──────────────────────
          CORE = '破甲一键通.py'
          core_pats = {
              'import requests': r'(?m)^\s*import\s+requests|from\s+requests\s+import',
              'import socket': r'(?m)^\s*import\s+socket|from\s+socket\s+import',
              'eval(': r'\beval\s*\(',
              'exec(': r'\bexec\s*\(',
              'os.system(': r'os\.system\s*\(',
              'shell=True': r'shell\s*=\s*True',
              'urllib.request': r'urllib\.request',
              'http.client': r'http\.client',
              'pickle/marshal': r'\bpickle\.|\bmarshal\.',
              '__import__(': r'__import__\s*\(',
              'subprocess 拼串命令': r'subprocess\.run\([^\[\n]*%|subprocess\.run\([^\[\n]*\.format\(',
          }
          bad = [n for n, c in count(CORE, core_pats).items() if c]
          for n, c in count(CORE, core_pats).items():
              print('  core %-18s %d' % (n, c))
          if bad:
              print('核心出现不该有的调用:', bad); sys.exit(1)

          # ── GUI：零网络例外 = 环境补全下载器 + 本地端口探测 ────────────
          # 例外 1：urllib.request 只允许出现在 _env_download（环境补全页的
          #         用户主动下载，URL 全部为脚本内字面量的官方/镜像源）——
          #         import 必须恰好 1 处，且每一处引用都落在该函数体内；
          #         函数体内「import + urlopen 调用」= 2 处字符串属正常写法，
          #         不能用「全文恰好 1 处」这种粗计数一刀切；
          # 例外 2：socket 只允许出现在 _port_busy（本地端口占用探测，防
          #         SO_REUSEADDR 假成功）—— 所有 connect 目标必须全是 127.0.0.1。
          # 其余敏感调用与核心同口径全 0。
          GUI = '破甲GUI.py'
          gui_pats = {
              'import requests': r'(?m)^\s*import\s+requests|from\s+requests\s+import',
              'eval(': r'\beval\s*\(',
              'exec(': r'\bexec\s*\(',
              'os.system(': r'os\.system\s*\(',
              'shell=True': r'shell\s*=\s*True',
              'http.client': r'http\.client',
              'pickle/marshal': r'\bpickle\.|\bmarshal\.',
              '__import__(': r'__import__\s*\(',
              'subprocess 拼串命令': r'subprocess\.run\([^\[\n]*%|subprocess\.run\([^\[\n]*\.format\(',
          }
          gsrc = open(GUI, encoding='utf-8').read()
          bad = [n for n, c in count(GUI, gui_pats).items() if c]
          for n, c in count(GUI, gui_pats).items():
              print('  gui  %-18s %d' % (n, c))
          if bad:
              print('GUI 出现不该有的调用:', bad); sys.exit(1)

          import ast
          tree = ast.parse(gsrc)
          fn = next((n for n in tree.body
                     if isinstance(n, ast.FunctionDef) and n.name == '_env_download'), None)
          if fn is None:
              print('GUI 里找不到 _env_download 函数'); sys.exit(1)
          occ = [gsrc.count(chr(10), 0, m.start()) + 1
                 for m in re.finditer(r'urllib\.request', gsrc)]
          n_imp = len(re.findall(r'(?m)^\s*import\s+urllib\.request\b', gsrc))
          bad_ln = [ln for ln in occ if not (fn.lineno <= ln <= fn.end_lineno)]
          print('  gui  urllib.request     %d 处（import %d，_env_download 第 %d~%d 行，全在体内则合规）' % (len(occ), n_imp, fn.lineno, fn.end_lineno))
          if n_imp != 1 or bad_ln:
              print('GUI 的 urllib.request 违规：import=%d（应 1），越出行号=%s' % (n_imp, bad_ln)); sys.exit(1)

          n_conn = len(re.findall(r'\.connect\(', gsrc))
          n_local = len(re.findall(r'\.connect\(\("127\.0\.0\.1"', gsrc))
          print('  gui  socket connect     %d/%d 指向 127.0.0.1（全为本地回环则合规）' % (n_local, n_conn))
          if n_conn != n_local:
              print('GUI 的 socket connect 存在非 127.0.0.1 目标！'); sys.exit(1)
          print('全部合规')
          "
