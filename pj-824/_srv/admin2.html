<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>破甲后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234cc38a'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230e1116'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
--bg:#0e1116;--pnl:#161a21;--pnl2:#1c222b;--line:#252d38;--txt:#e7edf5;--dim:#8b9aab;
--acc:#4cc38a;--acc2:#5aa9ff;--warn:#f0b429;--err:#ef5350;--rad:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--acc2);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--pnl2);border:1px solid var(--line);
border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc2)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3442;border-radius:6px}

/* 登录 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
background:radial-gradient(900px 500px at 50% -10%,#1b2a3a,#0e1116 60%);z-index:50}
#login .box{width:100%;max-width:340px;background:var(--pnl);border:1px solid var(--line);
border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
#login h1{margin:0 0 4px;font-size:19px;letter-spacing:.5px}
#login p{margin:0 0 18px;color:var(--dim);font-size:12px}

/* 骨架 */
#app{display:none;height:100%}
#app.on{display:flex}
aside{width:196px;flex:0 0 196px;background:var(--pnl);border-right:1px solid var(--line);
display:flex;flex-direction:column;overflow:hidden}
.brand{padding:15px 16px;font-weight:600;letter-spacing:.4px;border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
nav{overflow-y:auto;padding:8px 0 20px;flex:1}
nav .gt{color:var(--dim);font-size:11px;letter-spacing:1px;padding:12px 16px 5px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);
padding:8px 16px;font-size:13px;border-left:2px solid transparent;opacity:.86}
nav button:hover{background:#1c222b;opacity:1}
nav button.on{background:#1c222b;border-left-color:var(--acc);color:#fff;opacity:1}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
header{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:10px;padding:0 16px;
border-bottom:1px solid var(--line);background:var(--pnl)}
header h2{margin:0;font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth}

/* 组件 */
.card{background:var(--pnl);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card>.hd b{font-size:13px;font-weight:600}
.card>.hd .sp{flex:1}
.card>.bd{padding:14px}
.card>.bd.tight{padding:0}
.note{color:var(--dim);font-size:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--pnl2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .n{font-size:21px;font-weight:600;letter-spacing:.3px}
.kpi .l{color:var(--dim);font-size:11.5px;margin-top:2px}
.kpi.g{color:var(--acc)}.kpi.b{color:var(--acc2)}.kpi.w{color:var(--warn)}.kpi.r{color:var(--err)}
.btn{background:var(--pnl2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
padding:7px 12px;font-size:13px}
.btn:hover{border-color:#3a4759}
.btn.p{background:#1d3b2c;border-color:#2c5e45;color:#8ee6b3}
.btn.d{background:#3a1f22;border-color:#5c2a2e;color:#ffb0b0}
.btn.s{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.row .grow{flex:1 1 200px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;background:#141920;position:sticky;top:0}
tbody tr:hover{background:#1a2029}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:#8ee6b3;border-color:#2c5e45;background:#132a20}
.tag.err{color:#ffb0b0;border-color:#5c2a2e;background:#2a1417}
.tag.warn{color:#ffd479;border-color:#5a461c;background:#2a2210}
.bar{display:flex;align-items:flex-end;gap:2px;height:64px}
.bar i{flex:1;background:linear-gradient(180deg,#4cc38a,#2c7a58);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.sec-note{color:var(--dim);font-size:12px;margin:-4px 0 10px}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:300px;line-height:1.6}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{color:var(--dim);font-size:11.5px}
.fld .hint{color:#5f6d7d;font-size:11px}
.sw{display:flex;align-items:center;gap:8px;padding:6px 0}
.sw input{width:auto;flex:0 0 auto;transform:scale(1.15);accent-color:var(--acc)}
.fs{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#141920}
.fs>summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:#b9c6d4}
.fs>.bd{padding:4px 12px 12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#20303f;
border:1px solid #35506a;color:#d9ecff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:99;
box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:.2s}
.toast.on{opacity:1;bottom:34px}
.toast.err{background:#3a1f22;border-color:#5c2a2e;color:#ffc9c9}
.logbox{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:10px;
font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;
max-height:420px;overflow:auto;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.dot.off{background:#5b6572}
@media(max-width:820px){
  #app.on{flex-direction:column}
  aside{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:11px 14px}
  nav{display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:6px;white-space:nowrap}
  nav .gt{display:none}
  nav button{width:auto;border-left:0;border-bottom:2px solid transparent;border-radius:8px;padding:6px 11px}
  nav button.on{border-bottom-color:var(--acc);background:#1c222b}
  #view{padding:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>破甲后台</h1>
    <p>群聊机器人 · 客户端分发 · 服务器运维，一个入口</p>
    <div class="fld" style="margin-bottom:12px">
      <input id="l-p" type="password" placeholder="访问密码" autocomplete="current-password">
    </div>
    <button class="btn p" id="l-go" style="width:100%;padding:10px">进入</button>
    <div id="l-msg" class="note" style="margin-top:10px;min-height:18px"></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand"><i></i>破甲后台</div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <h2 id="ttl">概览</h2>
      <span class="note" id="hint"></span>
      <button class="btn s" id="btn-refresh">刷新</button>
      <button class="btn s" id="btn-out">退出</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<script>
/* ---------- 基础 ---------- */
var $ = function (s, r) { return (r || document).querySelector(s) };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)) };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c] }) }
function toast(msg, bad) {
  var t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t) }
  t.textContent = msg; t.className = 'toast on' + (bad ? ' err' : '');
  clearTimeout(t._tm); t._tm = setTimeout(function () { t.className = 'toast' }, 2600);
}
function bj(ts) {
  if (!ts) return '-';
  var d = new Date(Number(ts) < 1e12 ? Number(ts) * 1000 : Number(ts));
  var p = function (n) { return (n < 10 ? '0' : '') + n };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function ago(ts) {
  if (!ts) return '-';
  var d = Math.floor(Date.now() / 1000 - (Number(ts) > 1e12 ? Number(ts) / 1000 : Number(ts)));
  if (d < 0) d = 0;
  if (d < 60) return d + ' 秒前'; if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前'; return Math.floor(d / 86400) + ' 天前';
}
var TK = '';
async function api(path, body, method) {
  var opt = { method: method || (body !== undefined ? 'POST' : 'GET'), headers: {}, credentials: 'same-origin' };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body) }
  var r = await fetch('/adm/api/' + path, opt);
  if (r.status === 401) { showLogin('登录已过期，重新登录'); throw new Error('未登录') }
  var t = await r.text();
  try { return JSON.parse(t) } catch (e) { return { ok: 0, err: '响应不是 JSON：' + t.slice(0, 100) } }
}
function card(title, body, opt) {
  opt = opt || {};
  return '<div class="card"><div class="hd"><b>' + esc(title) + '</b><span class="sp"></span>' +
    (opt.right || '') + '</div><div class="bd' + (opt.tight ? ' tight' : '') + '">' + body + '</div></div>';
}
function kpi(n, l, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>' }
function tbl(head, rows) {
  if (!rows.length) return '<div class="bd note">没有数据</div>';
  return '<div style="overflow:auto"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>' }).join('') +
    '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + (c == null ? '' : c) + '</td>' }).join('') + '</tr>' }).join('') + '</tbody></table></div>';
}
function bars(vals, labels) {
  var max = Math.max.apply(null, vals.concat([1]));
  return '<div class="bar">' + vals.map(function (v, i) {
    return '<i style="height:' + Math.max(2, Math.round(v / max * 100)) + '%" title="' + esc((labels || [])[i] || '') + '：' + v + '"></i>'
  }).join('') + '</div>' + (labels ? '<div class="note" style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px"><span>' + esc(labels[0] || '') + '</span><span>' + esc(labels[labels.length - 1] || '') + '</span></div>' : '');
}
function sw(id, label, on) { return '<label class="sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>' }
function fld(label, input, hint) { return '<div class="fld"><label>' + esc(label) + '</label>' + input + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>' }

/* 通用 schema 表单：把一个配置对象摊平成可编辑控件，data-k 记录路径 */
function schemaForm(obj, path, depth) {
  path = path || ''; depth = depth || 0;
  var out = '';
  Object.keys(obj || {}).forEach(function (k) {
    var v = obj[k], p = path ? path + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v) && depth < 2) {
      out += '<details class="fs"><summary>' + esc(k) + '</summary><div class="bd"><div class="fields">' +
        schemaForm(v, p, depth + 1) + '</div></div></details>';
      return;
    }
    if (typeof v === 'boolean') { out += '<div class="fld"><label>' + esc(k) + '</label>' + sw('sf-' + p.replace(/\./g, '_'), v ? '开' : '关', v) + '</div>'; return }
    if (typeof v === 'number') { out += fld(k, '<input type="number" step="any" data-k="' + esc(p) + '" value="' + v + '">'); return }
    if (Array.isArray(v)) {
      out += fld(k, '<textarea data-k="' + esc(p) + '" data-arr="1" rows="2">' + esc(v.join('\n')) + '</textarea>', '每行一项');
      return;
    }
    var s = String(v == null ? '' : v);
    out += fld(k, (s.length > 60 ? '<textarea data-k="' + esc(p) + '" rows="3">' + esc(s) + '</textarea>'
      : '<input data-k="' + esc(p) + '" value="' + esc(s) + '">'));
  });
  return out;
}
function schemaRead(base, root) {
  var out = JSON.parse(JSON.stringify(base || {}));
  $$('[data-k]', root).forEach(function (el) {
    var p = el.getAttribute('data-k').split('.'), tgt = out;
    for (var i = 0; i < p.length - 1; i++) { if (typeof tgt[p[i]] !== 'object' || tgt[p[i]] === null) tgt[p[i]] = {}; tgt = tgt[p[i]] }
    var key = p[p.length - 1], old = tgt[key];
    if (el.getAttribute('data-arr')) tgt[key] = el.value.split(/\n|,/).map(function (x) { return x.trim() }).filter(Boolean);
    else if (typeof old === 'number') tgt[key] = Number(el.value) || 0;
    else if (typeof old === 'boolean') tgt[key] = !!el.checked;
    else tgt[key] = el.value;
  });
  $$('input[type=checkbox][id^=sf-]', root).forEach(function (el) {
    var p = el.id.slice(3).replace(/_/g, '.').split('.'), tgt = out;
    for (var i = 0; i < p.length - 1; i++) { if (typeof tgt[p[i]] !== 'object' || !tgt[p[i]]) tgt[p[i]] = {}; tgt = tgt[p[i]] }
    tgt[p[p.length - 1]] = el.checked;
  });
  return out;
}

/* ---------- 导航 ---------- */
var NAV = [
  ['概览', [['home', '总览'], ['health', '健康检查']]],
  ['QQ 机器人', [['bot', '状态 / 活动'], ['role', '人格切换'], ['model', '模型与思考'], ['social2', '二代仿真'],
    ['social1', '一代仿真'], ['slang', '黑话库'], ['tokens', '令牌与花费'], ['sessions', '会话与上下文'],
    ['wl', '白名单 / 管理员'], ['send', '发送测试'], ['bridge', '桥接与安全']]],
  ['客户端', [['dash', '数据看板'], ['db', '数据仓库'], ['data', '用户 / 激活码'], ['board', '留言板'],
    ['ads', '广告管理'], ['guiads', '开屏广告'], ['version', '版本 / 下载'], ['notice', '公告 / 捐赠'],
    ['groups', '群与退群清理'], ['income', '收入 / 解绑'], ['unlim', '无限卡'], ['words', '敏感词'],
    ['settings', '运行参数'], ['pirate', '盗版提示'], ['paycfg', '支付配置']]],
  ['运维', [['logs', '日志'], ['backup', '备份 / 回滚'], ['sql', 'SQL 查询'], ['notify', '通知通道'],
    ['audit', '操作审计'], ['search', '跨表搜索'], ['passwd', '改密码']]]
];
var PANELS = {}, CUR = '';
function buildNav() {
  var h = '';
  NAV.forEach(function (g) {
    h += '<div class="gt">' + esc(g[0]) + '</div>';
    g[1].forEach(function (it) { h += '<button data-sec="' + it[0] + '">' + esc(it[1]) + '</button>' });
  });
  $('#nav').innerHTML = h;
  $$('#nav button').forEach(function (b) { b.onclick = function () { go(b.dataset.sec) } });
}
function titleOf(sec) {
  for (var i = 0; i < NAV.length; i++) for (var j = 0; j < NAV[i][1].length; j++) if (NAV[i][1][j][0] === sec) return NAV[i][1][j][1];
  return sec;
}
async function go(sec) {
  CUR = sec;
  $$('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.sec === sec) });
  $('#ttl').textContent = titleOf(sec);
  location.hash = '#/' + sec;
  $('#view').innerHTML = '<div class="note" style="padding:20px">加载中…</div>';
  try { await (PANELS[sec] || function () { $('#view').innerHTML = card('未实现', '<div class="note">这个面板还没写</div>') })() }
  catch (e) { $('#view').innerHTML = card('出错了', '<div class="logbox">' + esc(e.message || e) + '</div>') }
}
$('#btn-refresh').onclick = function () { if (CUR) go(CUR) };
$('#btn-out').onclick = async function () { await api('logout', {}); showLogin('') };

/* ---------- 登录 ---------- */
function showLogin(msg) {
  $('#app').classList.remove('on'); $('#login').style.display = 'flex';
  $('#l-msg').textContent = msg || ''; $('#l-p').value = '';
  setTimeout(function () { $('#l-p').focus() }, 60);
}
async function doLogin() {
  var p = $('#l-p').value;
  if (!p) return;
  $('#l-go').disabled = true; $('#l-msg').textContent = '验证中…';
  try {
    var r = await api('login', { p: p });
    if (!r.ok) { $('#l-msg').textContent = r.err || '登录失败'; return }
    $('#login').style.display = 'none'; $('#app').classList.add('on');
    var sec = (location.hash || '').replace('#/', '') || 'home';
    go(sec);
  } finally { $('#l-go').disabled = false }
}
$('#l-go').onclick = doLogin;
$('#l-p').onkeydown = function (e) { if (e.key === 'Enter') doLogin() };
window.addEventListener('hashchange', function () {
  var sec = location.hash.replace('#/', '');
  if (sec && sec !== CUR && $('#app').classList.contains('on')) go(sec);
});

/* ================= 概览 ================= */
PANELS.home = async function () {
  var h = await api('sys/health');
  var d = await api('cloud/dashboard', {});
  var st = (d && d.stats) || {};
  var svc = (h.services || []).filter(function (x) { return x.state !== 'active' });
  var bad = svc.length;
  var nk = h.napcat || {};
  var html = '';
  html += '<div class="grid" style="margin-bottom:14px">' +
    kpi(nk.online ? '在线' : '离线', 'QQ 大肥鱼 ' + (nk.name || ''), nk.online ? 'g' : 'r') +
    kpi(bad ? bad + ' 个异常' : '全部正常', '后台服务', bad ? 'r' : 'g') +
    kpi(st.logins_today || 0, '今日登录次数', 'b') +
    kpi(st.devices_today || 0, '今日活跃设备', 'b') +
    kpi(st.new_users_7d || 0, '近 7 日新增注册') +
    kpi(st.total_devices || 0, '累计设备') +
    '</div>';
  var qs = '<div class="row">' +
    '<button class="btn p" id="q-qq">人格切换</button>' +
    '<button class="btn" id="q-nk">重启 NapCat</button>' +
    '<button class="btn" id="q-br">重启 QQ 桥接</button>' +
    '<button class="btn" id="q-bk">马上备份</button>' +
    '<button class="btn" id="q-hl">看健康检查</button>' +
    '</div>';
  html += card('快捷操作', qs);
  if (bad) html += card('有服务没起来', '<div class="row">' + svc.map(function (s) {
    return '<span class="tag err">' + esc(s.unit) + '：' + esc(s.state) + '</span>'
  }).join(' ') + '</div>');
  var st2 = await api('qq/status');
  var act = String(st2.activity || '').split('\n').filter(Boolean).slice(-25).reverse().join('\n');
  html += card('大肥鱼最近动作', '<div class="logbox" style="max-height:300px">' + esc(act || '（没有活动记录）') + '</div>',
    { right: '<span class="note">' + esc(st2.mode || '') + ' · ' + esc(st2.roleMode || '') + '</span>' });
  $('#view').innerHTML = html;
  $('#q-qq').onclick = function () { go('role') };
  $('#q-hl').onclick = function () { go('health') };
  $('#q-nk').onclick = async function () { if (!confirm('确定重启 NapCat 容器？期间机器人会短暂离线。')) return; await api('napcat/restart', {}); toast('已发出重启') };

PANELS.role = async function () {

    var tr = x.truncated ? '<span class="tag err">会被截断</span>' : '';

      '<button class="btn s" data-edit="' + esc(x.name) + '">编辑</button> ' +
      '<button class="btn s d" data-del="' + esc(x.name) + '">删除</button>'
    ]
  });
  html += card('人格列表（' + ROLE_ST.list.length + '）', tbl(['名称', '体积', '注入', '体检', '操作'], rows),
    { right: '<button class="btn s" id="r-new">新建人格</button>' });
  html += card('注入上限', '<div class="row"><input id="r-lim" type="number" style="max-width:150px" value="' +
    esc(lim.maxInjectChars || 6000) + '"><button class="btn" id="r-limsave">保存</button>' +
    '<span class="note">人格超过这个字数会被截断（1000~20000）</span></div>');
  html += card('编辑人格', '<div class="row" style="margin-bottom:8px">' +
    '<input id="r-name" placeholder="人格名（= 文件名）" style="max-width:260px">' +
    '<button class="btn s" id="r-load">读取</button><span class="note" id="r-msg"></span></div>' +
    '<textarea id="r-body" class="code" placeholder="在这里写人格提示词…"></textarea>' +
    '<div class="row" style="margin-top:10px"><button class="btn p" id="r-save">保存</button>' +
    '<button class="btn" id="r-saveas">另存为新人格</button>' +
    '<span class="note" id="r-cnt"></span></div>');
  $('#view').innerHTML = html;
  var bodyEl = $('#r-body');
  bodyEl.oninput = function () { $('#r-cnt').textContent = bodyEl.value.length + ' 字' };
  $$('[data-use]').forEach(function (b) {
    b.onclick = async function () {
      var r2 = await api('qq/role', { role: b.dataset.use });
      toast(r2.ok ? '已切换到「' + b.dataset.use + '」' : ('失败：' + r2.error), !r2.ok); go('role');
    }
  });
  $$('[data-edit]').forEach(function (b) {
    b.onclick = async function () {
      $('#r-name').value = b.dataset.edit; await loadRole(b.dataset.edit);
    }
  });
  $$('[data-del]').forEach(function (b) {
    b.onclick = async function () {
      if (!confirm('删除人格「' + b.dataset.del + '」？roles/' + b.dataset.del + '.md 会被删掉，不可恢复。')) return;
      var r2 = await api('qq/roles/delete', { name: b.dataset.del });
      toast(r2.ok ? '已删除' : ('失败：' + r2.error), !r2.ok); go('role');
    }
  });
  async function loadRole(name) {
    var r2 = await api('qq/roles/content?name=' + encodeURIComponent(name));
    if (!r2.ok && r2.content == null) { $('#r-msg').textContent = '读取失败：' + (r2.error || ''); return }
    bodyEl.value = r2.content || ''; $('#r-cnt').textContent = bodyEl.value.length + ' 字';
    $('#r-msg').textContent = '已载入 ' + name;
  }
  $('#r-load').onclick = function () { if ($('#r-name').value.trim()) loadRole($('#r-name').value.trim()) };
  $('#r-new').onclick = function () { $('#r-name').value = ''; bodyEl.value = ''; $('#r-msg').textContent = '写内容 → 另存为新人格'; bodyEl.focus() };
  $('#r-none').onclick = async function () { await api('qq/role', { role: null }); toast('已清空'); go('role') };
  $('#r-save').onclick = async function () {
    var name = $('#r-name').value.trim(), content = bodyEl.value;
    if (!name) { toast('先填人格名', true); return }
    var r2 = await api('qq/roles/update', { name: name, content: content });
    if (!r2.ok) { var r3 = await api('qq/roles/create', { name: name, content: content }); r2 = r3 }
    toast(r2.ok ? '已保存' : ('失败：' + r2.error), !r2.ok);
    if (r2.warnings && r2.warnings.length) $('#r-msg').textContent = '⚠ ' + r2.warnings.join('；');
  };
  $('#r-saveas').onclick = async function () {
    var name = $('#r-name').value.trim(), content = bodyEl.value;
    if (!name) { toast('先填人格名', true); return }
    if (!confirm('另存为新人格「' + name + '」？同名会覆盖。')) return;
    var r2 = await api('qq/roles/create', { name: name, content: content });
    toast(r2.ok ? '已另存' : ('失败：' + r2.error), !r2.ok); if (r2.ok) go('role');
  };
  $('#r-limsave').onclick = async function () {
    var r2 = await api('qq/roles/limit', { maxInjectChars: Number($('#r-lim').value) });
    toast(r2.ok ? '已设为 ' + r2.maxInjectChars : ('失败：' + r2.error), !r2.ok);
  };
};

    kpi(by.candidate.length, '待确认', 'w') + kpi(by.approved.length, '已入库', 'g') +

  html += card('操作', '<div class="row"><button class="btn" id="sl-ex">让 AI 抽取一批</button>' +
    '<button class="btn" id="sl-rs">让 AI 研究释义</button>' +
    '<span class="note">抽取有冷却时间；释义研究消耗 token。</span></div>');
  function list(arr, title, acts) {
    if (!arr.length) return card(title, '<div class="note">没有条目</div>');
    return card(title + '（' + arr.length + '）', tbl(['词', '释义', '用词示例', '出现', '操作'], arr.slice(0, 200).map(function (e) {
      return ['<b>' + esc(e.content) + '</b>', esc(String(e.meaning || '').slice(0, 60)),
        esc(String(e.usage || e.example || '').slice(0, 50)), esc(e.count || 1),
        acts.map(function (a) { return '<button class="btn s ' + (a[2] || '') + '" data-sl="' + a[0] + '" data-id="' + esc(e.id) + '">' + a[1] + '</button>' }).join(' ')
      ]
    })));
  }
  html += list(by.candidate, '待确认', [['approve', '入库', 'p'], ['reject', '拒绝'], ['delete', '删', 'd']]);
  html += list(by.approved, '已入库', [['delete', '删', 'd']]);
  if (by.rejected.length) html += list(by.rejected, '已拒绝', [['approve', '改成入库', 'p'], ['delete', '删', 'd']]);
  $('#view').innerHTML = html;

PANELS.bridge = async function () {
  var s = await api('qq/status');
  var sec = await api('qq/security');
  var html = card('桥接控制',
    '<div class="fields">' +
    fld('运行模式', '<select id="br-mode"><option value="closed">closed（完全关闭）</option>' +
      '<option value="reserved">reserved（一代仿真）</option><option value="reserved2">reserved2（二代仿真）</option></select>') +

    '<button class="btn d" id="br-rs">重启桥接</button><span class="note" id="br-msg">当前：' + esc(s.mode || '') + '</span></div>');
  html += card('发言开关', '<div class="row"><button class="btn" id="br-silent">切到静默（只看不说）</button>' +

    '<span class="note">当前：' + esc(s.roleMode || '') + '</span></div>');

    '<div class="row" style="margin-top:10px"><button class="btn p" id="sec-save">保存</button>' +
    '<button class="btn" id="sec-hard">重新收紧 state 权限</button><span class="note" id="sec-msg">' +
    ((sec.stateDir || {}).hardened ? '目录权限已收紧' : '目录权限未收紧') + '</span></div>');
  html += card('控制台令牌（内部用，浏览器不会再用它）',
    '<div class="row"><input id="ct-t" placeholder="留空则自动生成" style="max-width:340px">' +
    '<button class="btn" id="ct-save">更换</button><span class="note" id="ct-msg"></span></div>' +
    '<div class="note" style="margin-top:6px">换了之后本页面不受影响（令牌由服务端注入）。旧的 console.html 若还在用会失效。</div>');
  $('#view').innerHTML = html;
  $('#br-mode').value = s.mode || 'reserved2';
  $('#br-save').onclick = async function () {
    var r = await api('qq/mode', { mode: $('#br-mode').value, closedAgentPreset: '' });
    toast(r.ok ? '已保存' : '失败', !r.ok); $('#br-msg').textContent = r.dshSynced === false ? '已写本地但没同步到 DSH' : ('当前：' + $('#br-mode').value);
  };
  $('#br-rs').onclick = async function () { if (!confirm('重启桥接？机器人会断 5~10 秒。')) return; var r = await api('qq/restart', {}); toast(r.message || '重启中') };
  $('#br-silent').onclick = async function () { await api('qq/role-mode', { mode: 'silent' }); toast('已静默'); go('bridge') };
  $('#br-active').onclick = async function () { await api('qq/role-mode', { mode: 'active' }); toast('已恢复'); go('bridge') };
  $('#sec-save').onclick = async function () {
    var r = await api('qq/security', { interceptNotify: $('#sec-n').checked });
    toast(r.ok ? '已保存' : '失败', !r.ok);
  };
  $('#sec-hard').onclick = async function () {
    var r = await api('qq/security', { rehardenStateDir: true });
    $('#sec-msg').textContent = r.hardened ? '已收紧' : '仍未收紧（需要 root 权限）'; toast(r.hardened ? '已收紧' : '失败', !r.hardened);
  };
  $('#ct-save').onclick = async function () {
    var t = $('#ct-t').value.trim();
    if (!t) t = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function (b) { return ('0' + b.toString(16)).slice(-2) }).join('');
    var r = await api('qq/console/token', { token: t });
    $('#ct-msg').textContent = r.ok ? '已更换为 ' + r.token : ('失败：' + (r.error || '')); toast(r.ok ? '已更换' : '失败', !r.ok);
  };
};

  $('#view').innerHTML = html;

  function draw() {
    $('#ad-list').innerHTML = state.map(function (a, i) {

        '<img src="/adm/api/cloudimg?ep=ads&id=' + encodeURIComponent(a.id) + '&t=' + Date.now() + '" style="width:100%;border-radius:8px;background:#0b0e13;min-height:40px" onerror="this.style.display=\'none\'">' +

        '<div class="fld" style="margin-top:6px"><label>跳转链接</label><input data-ad-l="' + i + '" value="' + esc(a.link) + '"></div>' +
        sw('ad-on-' + i, '启用', a.enabled) +
        '<button class="btn s d" data-ad-d="' + i + '" style="margin-top:6px">删除</button></div>'
    }).join('') || '<div class="note">还没有广告</div>';

    $$('[data-ad-l]').forEach(function (el) { el.oninput = function () { state[+el.dataset.adL].link = el.value } });
    state.forEach(function (a, i) { var c = $('#ad-on-' + i); if (c) c.onchange = function () { state[i].enabled = c.checked } });

    });

  };
};

/* ================= 客户端：盗版提示 ================= */
PANELS.pirate = async function () {

  $('#view').innerHTML = card('盗版群号提示（用户在客户端输入这些群号时的弹窗）',
    '<div class="fld"><label>标题</label><input id="p-t" value="' + esc(r.title || '') + '"></div>' +

    '<div class="row" style="margin-top:12px"><button class="btn p" id="p-save">保存</button><span class="note" id="p-msg"></span></div>');

/* ================= 客户端：支付 ================= */
PANELS.paycfg = async function () {
  var r = await api('cloud/paycfg', {});
  var html = card('解绑支付配置',
    '<div class="fields">' +
    fld('模式', '<input id="pc-mode" value="' + esc(r.mode || '') + '">') +
    fld('金额', '<input id="pc-amt" type="number" step="0.01" value="' + esc(r.amount || 0) + '">') +
    fld('标题', '<input id="pc-t" value="' + esc(r.title || '') + '">') +
    '</div>' +
    '<div class="fld" style="margin-top:10px"><label>网关 / 商户配置</label><textarea id="pc-raw" class="code" style="min-height:180px">' +
    esc(JSON.stringify(r.epay || {}, null, 2)) + '</textarea></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn p" id="pc-save">保存</button><span class="note" id="pc-msg"></span></div>');
  html += '<div class="note" style="padding:0 4px 20px">改支付参数属于高风险操作：改完先用 1 元小额走一单验证回调。</div>';

</script>
<script>
/* ================= 运维：日志 ================= */
PANELS.logs = async function () {
  var units = ['pojia-cloud', 'pojia-code-web', 'qq-bridge', 'pojia-qq-easteregg', 'pojia-qq-guard',
    'pojia-site', 'napcat-guard', 'pojia-card', 'nginx'];
  var html = card('日志尾巴', '<div class="row"><select id="lg-u" style="max-width:220px">' +
    units.map(function (u) { return '<option>' + u + '</option>' }).join('') +
    '<option value="__docker">napcat 容器（docker logs）</option></select>' +
    '<select id="lg-n" style="max-width:120px"><option value="100">100 行</option><option value="300" selected>300 行</option><option value="800">800 行</option></select>' +
    '<button class="btn p" id="lg-go">拉取</button></div><div id="lg-out" style="margin-top:10px"></div>');
  $('#view').innerHTML = html;
  async function pull() {
    var u = $('#lg-u').value, n = $('#lg-n').value;
    $('#lg-out').innerHTML = '<div class="note">读取中…</div>';
    var r = u === '__docker' ? await api('sys/dlog?n=' + n) : await api('sys/logs?unit=' + encodeURIComponent(u) + '&n=' + n);
    $('#lg-out').innerHTML = '<div class="logbox">' + esc(r.text || r.err || '（空）') + '</div>';
  }
  $('#lg-go').onclick = pull; pull();
};

/* ================= 运维：备份 ================= */
PANELS.backup = async function () {
  var r = await api('sys/backups');
  var w = await api('sys/watch').catch(function () { return {} });
  var ab = (w && w.autobak) || {};
  var html = '';
  html += card('每日自动备份', '<div class="row">' +
    (ab.enabled ? '<span class="tag ok">定时器已开</span>' : '<span class="tag err">定时器没开</span>') +
    '<span class="note">下次执行：' + esc(ab.next || '未排期') + '</span>' +
    '<span class="note">当前保留 ' + esc(ab.count || 0) + ' 份（自动保留 14 份，旧的自动删）</span></div>' +
    '<div class="note" style="margin-top:6px">每天 04:10（服务器时间）自动打包一次：云配置 + SQLite 库 + 桥接配置 + 人格目录 + 会话状态 + 本后台密码。开启后重启机器也不会丢。</div>');
  html += card('备份', '<div class="row"><input id="bk-note" placeholder="备注（可选）" style="max-width:240px">' +
    '<button class="btn p" id="bk-go">马上备份</button><span class="note">包含：云配置、SQLite 库、桥接配置、人格目录、会话状态、本后台密码</span></div>');
  html += card('历史备份', tbl(['文件名', '大小', '时间', '操作'], (r.items || []).map(function (x) {
    return ['<span class="mono">' + esc(x.name) + '</span>', (x.bytes / 1024).toFixed(0) + ' KB', esc(x.t),
      '<button class="btn s d" data-rb="' + esc(x.name) + '">回滚</button>']
  })), { right: '<button class="btn s" id="bk-re">刷新</button>' });
  html += '<div class="note" style="padding:0 4px 20px">回滚会覆盖当前配置与数据库，动手前它会先自动做一份「回滚前」备份。</div>';
  $('#view').innerHTML = html;
  $('#bk-re').onclick = function () { go('backup') };
  $('#bk-go').onclick = async function () {
    var r2 = await api('sys/backup', { note: $('#bk-note').value });
    toast(r2.ok ? '备份完成：' + r2.name : ('失败：' + r2.err), !r2.ok); if (r2.ok) go('backup');
  };
  $$('[data-rb]').forEach(function (b) {
    b.onclick = async function () {
      if (!confirm('用「' + b.dataset.rb + '」覆盖当前配置和数据库？\n服务可能需要重启才生效。')) return;
      var r2 = await api('sys/restore', { name: b.dataset.rb });
      toast(r2.ok ? '已回滚，建议重启相关服务' : ('失败：' + r2.err), !r2.ok);
    }
  });
};

/* ================= 运维：通知 ================= */
PANELS.notify = async function () {
  var c = await api('cloud/config', {});
  var m = c.mail || {}, t = c.telegram || {};
  var html = card('通知通道',
    '<div class="fields">' +
    fld('邮件收件人', '<input value="' + esc(m.to || '') + '" disabled>') +
    fld('SMTP', '<input value="' + esc((m.host || '') + ':' + (m.port || '')) + '" disabled>') +
    fld('Telegram chat_id', '<input value="' + esc(t.chat_id || '') + '" disabled>') +
    '</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn p" id="nt-mail">发测试邮件</button>' +
    '<button class="btn p" id="nt-tg">发测试 Telegram</button><span class="note" id="nt-msg"></span></div>' +
    '<div class="note" style="margin-top:8px">通道参数在「客户端 → 运行参数」里开关；SMTP / bot token 需要改 config.json（这里只读，避免误操作）。</div>');
  $('#view').innerHTML = html;
  $('#nt-mail').onclick = async function () { $('#nt-msg').textContent = '发送中…'; var r = await api('sys/notify', { ch: 'mail' }); $('#nt-msg').textContent = r.ok ? r.msg : ('失败：' + r.err); toast(r.ok ? '已发送' : '失败', !r.ok) };
  $('#nt-tg').onclick = async function () { $('#nt-msg').textContent = '发送中…'; var r = await api('sys/notify', { ch: 'telegram' }); $('#nt-msg').textContent = r.ok ? '已发送' : ('失败：' + (r.err || JSON.stringify(r.resp || {}))); toast(r.ok ? '已发送' : '失败', !r.ok) };
};

/* ================= 运维：审计 ================= */
PANELS.audit = async function () {
  var r = await api('sys/audit?n=300');
  $('#view').innerHTML = card('后台操作审计（' + (r.items || []).length + '）', tbl(['时间', 'IP', '动作', '详情'], (r.items || []).map(function (x) {
    return [esc(bj(x.t)), '<span class="mono">' + esc(x.ip) + '</span>', esc(x.act), '<span class="mono">' + esc(String(x.detail || '').slice(0, 160)) + '</span>']
  })), { right: '<button class="btn s" id="au-re">刷新</button>' });
  $('#au-re').onclick = function () { go('audit') };
};

/* ================= 运维：搜索 ================= */
PANELS.search = async function () {
  var html = card('跨表搜索', '<div class="row"><input id="se-q" class="grow" placeholder="激活码 / QQ / HWID / IP / 留言内容（直接查 SQLite，比原后台快）">' +
    '<button class="btn p" id="se-go">搜索</button></div><div id="se-out" style="margin-top:12px"></div>');
  $('#view').innerHTML = html;
  async function run() {
    var q = $('#se-q').value.trim();
    if (q.length < 2) { toast('至少两个字', true); return }
    $('#se-out').innerHTML = '<div class="note">查询中…</div>';
    var r = await api('sys/search?q=' + encodeURIComponent(q));
    if (!r.ok) { $('#se-out').innerHTML = '<div class="note">' + esc(r.err || '失败') + '</div>'; return }
    var h = '';
    if (r.users && r.users.length) h += card('用户（' + r.users.length + '）', tbl(['QQ', '激活码', '注册', '最近登录', '封禁'], r.users.map(function (u) {
      return [esc(u.qq), '<span class="mono">' + esc(u.code || '') + '</span>', esc(bj(u.t)), esc(bj(u.last_login)), u.banned ? '<span class="tag err">已封</span>' : '-']
    })));
    if (r.codes && r.codes.length) h += card('激活码（' + r.codes.length + '）', tbl(['激活码', 'HWID', '时间', '备注'], r.codes.map(function (c) {
      return ['<span class="mono">' + esc(c.code) + '</span>', '<span class="mono">' + esc(String(c.hwid || '-').slice(0, 22)) + '</span>', esc(bj(c.t)), esc(c.note || '')]
    })));
    if (r.devices && r.devices.length) h += card('设备（' + r.devices.length + '）', tbl(['HWID', '激活码', 'QQ', '最近在线', 'IP', '版本'], r.devices.map(function (d) {
      return ['<span class="mono">' + esc(String(d.hwid).slice(0, 22)) + '</span>', '<span class="mono">' + esc(d.code || '') + '</span>', esc(d.qq || ''), esc(bj(d.last_ts)), '<span class="mono">' + esc(d.ip || '') + '</span>', esc(d.ver || '')]
    })));
    if (r.board && r.board.length) h += card('留言（' + r.board.length + '）', tbl(['时间', 'QQ', '内容'], r.board.map(function (p) {
      return [esc(bj(p.ts)), esc(p.qq), esc(String(p.text || '').slice(0, 160))]
    })));
    $('#se-out').innerHTML = h || '<div class="note">没有命中</div>';
  }
  $('#se-go').onclick = run;
  $('#se-q').onkeydown = function (e) { if (e.key === 'Enter') run() };
};

/* ================= 运维：SQL 查询 ================= */
PANELS.sql = async function () {
  var t = await api('sys/sql/tables');
  var tabs = (t.items || []);
  var html = card('只读 SQL',
    '<div class="row" style="margin-bottom:8px">' +
    tabs.map(function (x) {
      return '<button class="btn s" data-tb="' + esc(x.name) + '" title="' + esc(x.rows + ' 行') + '">' +
        esc(x.name) + ' <span style="opacity:.5">' + esc(x.rows) + '</span></button>'
    }).join(' ') + '</div>' +
    '<textarea id="sq-q" spellcheck="false" style="width:100%;min-height:110px;background:#0b0e12;color:var(--txt);' +
    'border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace">' +
    'SELECT * FROM users ORDER BY t DESC LIMIT 20</textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn p" id="sq-go">执行（Ctrl+Enter）</button>' +
    '<span class="note" id="sq-msg">只读连接，写操作会被 SQLite 直接拒绝；最多返回 500 行。</span></div>' +
    '<div id="sq-out" style="margin-top:12px"></div>');
  $('#view').innerHTML = html;
  $$('[data-tb]').forEach(function (b) {
    b.onclick = function () {
      $('#sq-q').value = 'SELECT * FROM "' + b.dataset.tb + '" LIMIT 20';
      $('#sq-q').focus();
    }
  });
  async function run() {
    var q = $('#sq-q').value.trim();
    if (!q) return;
    $('#sq-msg').textContent = '执行中…';
    var r = await api('sys/sql', { sql: q });
    if (!r.ok) {
      $('#sq-msg').textContent = '失败';
      $('#sq-out').innerHTML = '<div class="logbox" style="color:var(--err)">' + esc(r.err || '失败') + '</div>';
      return
    }
    $('#sq-msg').textContent = r.rows.length + ' 行 · ' + r.ms + ' ms' + (r.truncated ? '（已截断到 500 行）' : '');
    if (!r.cols.length) { $('#sq-out').innerHTML = '<div class="note">语句已执行，没有结果集。</div>'; return }
    $('#sq-out').innerHTML = card('结果',
      '<div style="overflow:auto;max-height:60vh">' + tbl(r.cols, r.rows.map(function (row) {
        return row.map(function (v) {
          var s = v === null ? 'NULL' : String(v);
          return '<span class="mono">' + esc(s.length > 300 ? s.slice(0, 300) + '…' : s) + '</span>'
        })
      })) + '</div>');
  }
  $('#sq-go').onclick = run;
  $('#sq-q').onkeydown = function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run() } };
};

/* ================= 运维：改密码 ================= */
PANELS.passwd = async function () {
  $('#view').innerHTML = card('改后台密码',
    '<div class="fields">' +
    fld('原密码', '<input id="pw-o" type="password">') +
    fld('新密码（至少 8 位）', '<input id="pw-n" type="password">') +
    fld('再输一次', '<input id="pw-n2" type="password">') +
    '</div><div class="row" style="margin-top:12px"><button class="btn p" id="pw-go">保存</button><span class="note" id="pw-msg"></span></div>' +
    '<div class="note" style="margin-top:10px">密码只存在本机（PBKDF2-SHA256，20 万次迭代），不落明文。</div>');
  $('#pw-go').onclick = async function () {
    if ($('#pw-n').value !== $('#pw-n2').value) { toast('两次输入不一致', true); return }
    var r = await api('auth/passwd', { old: $('#pw-o').value, new: $('#pw-n').value });
    $('#pw-msg').textContent = r.ok ? '已更新' : ('失败：' + (r.err || '')); toast(r.ok ? '密码已更新' : '失败', !r.ok);
  };
};

/* ---------- 启动 ---------- */
buildNav();
(async function () {
  try {
    var me = await api('me');
    if (me.authed) { $('#login').style.display = 'none'; $('#app').classList.add('on'); go((location.hash || '').replace('#/', '') || 'home') }
    else showLogin('');
  } catch (e) { showLogin('') }
})();
</script>
