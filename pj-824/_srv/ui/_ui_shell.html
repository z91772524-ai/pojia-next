<div id="login">
  <div class="hero">
    <div class="top">
      <span class="mark"></span>
      <span class="kick">Pojia · Control</span>
    </div>
    <div class="bottom">
      <h1>破甲<em>后台</em></h1>
      <p>群聊机器人、客户端分发、服务器运维 —— 一个入口管到底。</p>
      <div class="rowmeta">
        <span>pojia-admin</span><span>127.0.0.1:3120</span><span>Beijing / UTC+8</span>
      </div>
    </div>
  </div>
  <div class="formwrap">
    <div class="box">
      <div class="lbl">Access</div>
      <h2>输入访问密码</h2>
      <div class="fld">
        <input id="l-p" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn p" id="l-go" style="width:100%;padding:10px">进入后台</button>
      <div id="l-msg" class="note"></div>
    </div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand">
      <span class="mark"></span>
      <span class="nm">破甲后台</span>
      <span class="ver">v8.28</span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <span class="tick"></span>
      <h2 id="ttl">概览</h2>
      <span class="stat"><i class="dot on" id="netdot"></i><span id="hint">已连接</span></span>
      <span class="clock" id="clock">--:--:--<small>UTC+8</small></span>
      <button class="btn s ghost" id="btn-refresh">刷新</button>
      <button class="btn s ghost" id="btn-out">退出</button>
    </header>
    <div id="view"></div>
  </main>
</div>
