<div id="bg" aria-hidden="true"></div>
<div id="pbar" role="progressbar" aria-label="加载中"></div>

<div id="login">
  <div class="box">
    <div class="hd">
      <span class="mark"></span>
      <b>破甲后台</b>
      <em>v8.28</em>
    </div>
    <h1>欢迎回来</h1>
    <p class="sub">群聊机器人 · 客户端分发 · 服务器运维</p>
    <div class="fld">
      <label for="l-p">访问密码</label>
      <input id="l-p" type="password" placeholder="请输入访问密码" autocomplete="current-password">

<div id="app">

    <div class="brand">
      <span class="mark"></span>

    </div>

  </aside>
  <main>
    <header>
      <h2 id="ttl">概览</h2>
      <span class="stat"><i class="dot on" id="netdot"></i><span id="hint">已连接</span></span>

      <button class="btn s ghost" id="btn-refresh">刷新</button>
      <button class="btn s ghost" id="btn-out">退出</button>
